[project]
name = "svglab"
version = "0.0.0"
description = "The Python library for parsing, manipulating, and optimizing SVG files."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Tomáš Režňák", email = "tomas.reznak@proton.me" }]
keywords = [
  "affine transformation",
  "image optimization",
  "image processing",
  "svg",
  "svg manipulation",
  "vector graphics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Text Processing :: Markup :: XML",
  "Typing :: Typed",
]
dependencies = [
  "beautifulsoup4>=4.11.1",
  "bidict>=0.22.0,<0.25.0",
  "lark>=1.1.8",
  "lxml>=5.1.0,!=6.0.0,!=6.0.1",
  "more-itertools>=9.0.0",
  "numpy>=2.0.0",
  "pillow>=9.2.0",
  "pydantic>=2.12.0,<3.0.0",
  "pydantic-extra-types>=2.2.0,<3.0.0",
  "rfc3986>=1.5.0",
  "typing-extensions>=4.6.0",
  "useful-types>=0.1.0,<0.3.0",
]

[project.urls]
"Documentation" = "https://svglab.rocks/"
"GitHub" = "https://github.com/reznakt/svglab"
"Issues" = "https://github.com/reznakt/svglab/issues"

[project.optional-dependencies]
html5lib = ["html5lib>=1.1"]

[dependency-groups]
dev = [
  "check-jsonschema>=0.38.2",
  "deptry>=0.25.1",
  "licensecheck>=2025.1.0",
  "pyright>=1.1.414",
  "ruff>=0.16.9",
  "vermin>=1.6.0",
]
docs = [
  "cairosvg>=2.9.1",
  "griffe-fieldz>=0.5.0",
  "mkdocs-gen-files>=0.6.1",
  "mkdocs-git-committers-plugin-2>=2.5.0",
  "mkdocs-git-revision-date-localized-plugin>=1.6.0",
  "mkdocs-literate-nav>=0.6.3",
  "mkdocs-material>=9.7.3",
  "mkdocs-minify-plugin>=0.8.0",
  "mkdocs-redirects>=1.2.2",
  "mkdocstrings-python>=2.0.9",
  "pillow>=12.1.1",
  "properdocs>=1.6.7",
  "ruff>=0.16.9",
]
test = [
  "hypothesis>=6.168.3",
  "pytest>=9.0.2",
  "pytest-accept>=0.2.3",
  "pytest-cov>=7.0.0",
  "pytest-pretty>=1.3.0",
  "pytest-randomly>=5.0.0",
  "pytest-xdist>=3.8.0",
]
types = ["types-beautifulsoup4>=4.12.0.20250516"]

[build-system]
requires = ["maturin>=1.15.0,<2.0"]
build-backend = "maturin"

[tool.coverage.run]
# `sys.monitoring` costs next to nothing; older Pythons fall back to the tracer
core = "sysmon"
omit = ["tests/*"]

[tool.deptry.per_rule_ignores]
DEP002 = ["lxml", "html5lib"]  # parser backends that BeautifulSoup loads by name
DEP003 = ["pydantic_core"]  # pinned exactly by pydantic

[tool.licensecheck]
format = "ansi"
ignore_packages = [
  "useful-types",  # MIT
]
zero = true

[tool.maturin]
exclude = ["**/__pycache__/**/*"]
features = ["pyo3/extension-module"]
include = [
  { path = "LICENSE", format = "sdist" },
  { path = "tests/**/*", format = "sdist" },
]
manifest-path = "src/svglab-resvg/Cargo.toml"
module-name = "svglab._resvg"
python-source = "src"

[tool.pyright]
deprecateTypingAliases = false  # covered by Ruff + shows false positives
enableReachabilityAnalysis = true
pythonPlatform = "All"
pythonVersion = "3.11"
reportImplicitOverride = true
reportInvalidTypeVarUse = true
reportMissingImports = true
reportMissingTypeArgument = true
reportMissingTypeStubs = false
reportPrivateUsage = true
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportUnnecessaryTypeIgnoreComment = true
reportUntypedFunctionDecorator = true
reportUnusedImport = false  # covered by Ruff
strictDictionaryInference = true
strictListInference = true
strictSetInference = true
typeCheckingMode = "strict"

[tool.pytest]
addopts = [
  "--cov",
  "--doctest-continue-on-failure",
  "--doctest-modules",
  "--numprocesses=auto",
]
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]
filterwarnings = [
  # https://bugs.launchpad.net/beautifulsoup/+bug/2076897
  "ignore:The 'strip_cdata' option of HTMLParser\\(\\) has never done anything and will eventually be removed.",
]
strict = true
# `scripts/` and `hooks/` only run inside a documentation build, so they are
# deliberately left out of doctest collection
testpaths = ["src", "tests"]

[tool.ruff]
target-version = "py311"
show-fixes = true
line-length = 75  # formatter

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]
# preview rules are opted into one by one; keep `ALL` from pulling in the rest
preview = true
explicit-preview-rules = true
extend-select = [
  "D421",  # Property docstring should not start with a verb
  "DOC102",  # Documented parameter is not in the function's signature
  "DOC201",  # `return` is not documented in docstring
  "DOC202",  # Docstring should not have a returns section
  "DOC402",  # `yield` is not documented in docstring
  "DOC403",  # Docstring should not have a yields section
  "DOC501",  # Raised exception missing from docstring
  "DOC502",  # Raised exception is not explicitly raised
  "FURB118",  # Use `operator` functions instead of lambdas
  "FURB140",  # Use `itertools.starmap` instead of the generator
  "PLR6201",  # Use a set literal when testing for membership
  "RUF105",  # Use `ruff: ignore` instead of `noqa`
]
ignore = [
  # conflicts
  "D211",  # No blank lines allowed before class docstring
  "D213",  # Multi-line docstring summary should start at the second line
  "COM812",  # Missing trailing comma in a tuple
  "D203",  # 1 blank line required before class docstring
  "UP035",  # Conflicts with ban on `typing`

  # missing docstrings
  "D105",  # Missing docstring in magic method

  # docstring contents
  "DOC502",  # Raised exception is not explicitly raised (callees raise it)

  # exceptions
  "TRY003",  # Avoid specifying long messages outside the exception class
  "EM101",  # Exception must not use a string literal

  # `TODO`s
  "FIX002",  # Line contains TODO
  "TD002",  # Missing author in TODO
  "TD003",  # Missing issue link on the line following this TODO

  # misc
  "S101",  # Use of assert detected
  "TC001",  # Move application import into a type-checking block
  "TC002",  # Move third-party import into a type-checking block
  "TC003",  # Move standard library import into a type-checking block
  "PLR0913",  # Too many arguments in function definition
  "PLR0917",  # Too many positional arguments
  "C901",  # Function is too complex
  "PLR0911",  # Too many return statements
  "PLR0912",  # Too many branches
  "TC006",  # Add quotes to type expression in `typing.cast()`
  "CPY001",  # Missing copyright notice at top of file
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*" = [
  "D",  # pydocstyle
  "DOC",  # pydoclint
  "PLR2004",  # Magic value used in comparison
  "S311",  # Standard pseudo-random generators are not suitable for security/cryptographic purposes
]

[tool.ruff.lint.pycodestyle]
max-line-length = 79  # linter

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"abc.ABC".msg = "Use `metaclass=abc.ABCMeta` instead"
"typing".msg = "Use `typing_extensions` instead"

[tool.ruff.lint.isort]
lines-after-imports = 2
split-on-trailing-comma = false

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

# Cargo's schema declares TOML 1.1, which cargo parses only from Rust 1.94
[[tool.tombi.schemas]]
toml-version = "v1.0.0"
path = "tombi://www.schemastore.org/cargo.json"
include = ["Cargo.toml"]

[tool.uv]
default-groups = ["dev", "test", "types", "docs"]
