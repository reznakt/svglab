[package]
name = "svglab-resvg"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
name = "_resvg"

[dependencies]
pyo3-log = "0.13"

[dependencies.pyo3]
version = "0.29"
features = ["abi3-py311"]

[dependencies.resvg]
version = "0.48.1"
default-features = false
features = ["memmap-fonts", "raster-images", "system-fonts", "text"]

[lints.clippy]
doc_markdown = "allow"
pedantic = { level = "warn", priority = -1 }
too_many_arguments = "allow"
undocumented_unsafe_blocks = "warn"

[lints.rust]
unsafe_code = "deny"

[profile.dist]
inherits = "release"
strip = true
lto = true
codegen-units = 1
