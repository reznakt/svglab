[package]
name = "svglab-resvg"
# kept in sync with the last release by hand; the release workflow stamps
# the published version in (see `.github/actions/stamp-version`), so this
# key must stay on one line with no trailing comment
version = "0.16.0"
description = "Python bindings to resvg for the svglab package."
repository = "https://github.com/reznakt/svglab"
license = "MIT"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "_resvg"
crate-type = ["cdylib"]

[dependencies]

resvg = { version = "0.48.1", default-features = false, features = [
  "memmap-fonts",
  "raster-images",
  "system-fonts",
  "text",
] }
pyo3-log = "0.13"

[dependencies.pyo3]
version = "0.29"
features = ["abi3-py310"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
too_many_arguments = "allow"

[profile.dist]
inherits = "release"
codegen-units = 1
lto = true
strip = true
