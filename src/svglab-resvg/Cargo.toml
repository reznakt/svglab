[package]
name = "svglab-resvg"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
name = "_resvg"
crate-type = ["cdylib"]

[dependencies]

resvg = { version = "0.48.1", default-features = false, features = [
  "memmap-fonts",
  "raster-images",
  "system-fonts",
  "text",
] }
pyo3-log = "0.13"

[dependencies.pyo3]
version = "0.29"
features = ["abi3-py310"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
too_many_arguments = "allow"

[profile.dist]
inherits = "release"
codegen-units = 1
lto = true
strip = true
