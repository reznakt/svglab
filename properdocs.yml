site_name: SVGLAB Documentation
site_description: A manipulation and optimization library for Scalable Vector Graphics
site_author: Tomáš Režňák
site_url: https://svglab.rocks/

copyright: Copyright &copy 2024 Tomáš Režňák

repo_url: https://github.com/reznakt/svglab
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Overview: overview.md
  - Playground: playground.md
  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - User Guide:
      - user-guide/index.md
      - Elements: user-guide/elements.md
      - Attributes: user-guide/attributes.md
      - Traits: user-guide/traits.md
      - Parsing: user-guide/parsing.md
      - Serialization: user-guide/serialization.md
      - Path Data: user-guide/path-data.md
      - Transforms: user-guide/transforms.md
      - Graphical Operations: user-guide/graphics.md
  - API Reference: api-reference/

theme:
  name: material
  language: en

  font:
    text: Inter
    code: JetBrains Mono
  logo: &logo assets/logo.svg
  favicon: *logo
  custom_dir: docs/overrides

  icon:
    repo: fontawesome/brands/github

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default

      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.footnote.tooltips
    - content.tooltips
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.preview
    - navigation.instant.progress
    - navigation.path
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

hooks:
  - hooks/griffe_mro_cache.py
  - hooks/playground_wheel.py

plugins:
  - optimize

  - gen-files:
      scripts:
        - scripts/gen_api_pages.py

  - literate-nav:
      nav_file: SUMMARY.md
  - privacy
  - search
  - social:
      cards_layout_options:
        background_color: "#3f51b5"
        color: "#ffffff"
        font_family: Inter
        logo: docs/assets/logo.svg

  - git-revision-date-localized:
      enable_creation_date: true
      exclude:
        - api-reference/elements/*
        - api-reference/traits/*

  - git-committers:
      repository: reznakt/svglab
      branch: main
      exclude:
        - api-reference/elements/*
        - api-reference/traits/*

  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
      cache_safe: true

  - mkdocstrings:
      enabled: !ENV [CI, false]
      handlers:
        python:
          options:
            extensions:
              - griffe_fieldz:
                  include_inherited: true
            allow_inspection: true
            show_bases: true
            docstring_style: google
            docstring_section_style: table
            show_if_no_docstring: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            summary: true
            show_submodules: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            unwrap_annotated: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.betterem
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tilde
  - tables
  - pymdownx.magiclink:
      repo_url_shortener: true
      repo_url_shorthand: true
      user: reznakt
      repo: svglab
      normalize_issue_symbols: true
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
      linenums: false
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
      auto_append:
        - includes/glossary.md
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - js/keybinds.js
  - js/mathjax.js
  - js/playground.js

extra_css:
  - css/extra.css
  - css/mathjax.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/reznakt/svglab
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/svglab/
