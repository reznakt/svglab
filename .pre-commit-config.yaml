default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge

fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        args: ["--unsafe"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.23
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: lint
        name: lint
        entry: just lint-fix
        language: system
        pass_filenames: false
      - id: format
        name: format
        entry: just format-fix
        language: system
        pass_filenames: false
      - id: secretcheck
        name: secretcheck
        entry: just secretcheck --pre-commit --staged
        language: system
        pass_filenames: false
      - id: schemacheck
        name: schemacheck
        entry: just schemacheck
        language: system
        files: ^(CITATION\.cff|\.github/dependabot\.yml|codecov\.yml)$
        pass_filenames: false
      - id: docs
        name: docs
        entry: just docs --strict
        language: system
        files: ^(docs/|properdocs\.yml$)
        pass_filenames: false
      - id: workflowcheck
        name: workflowcheck
        entry: just workflowcheck
        language: system
        files: ^\.github/
        pass_filenames: false
      - id: depcheck
        name: depcheck
        entry: just depcheck
        language: system
        files: ^(.*\.(py|rs)|pyproject\.toml|uv\.lock|src/svglab-resvg/Cargo\.(toml|lock))$
        pass_filenames: false
      - id: versioncheck
        name: versioncheck
        entry: just versioncheck
        language: system
        types: [python]
        pass_filenames: false
      - id: licensecheck
        name: licensecheck
        entry: just licensecheck
        language: system
        files: ^(pyproject\.toml|uv\.lock|src/svglab-resvg/(Cargo\.(toml|lock)|deny\.toml))$
        pass_filenames: false
      - id: typecheck
        name: typecheck
        entry: just typecheck
        language: system
        types: [python]
        pass_filenames: false
      - id: test
        name: test
        entry: just test
        language: system
        types: [python]
        pass_filenames: false
