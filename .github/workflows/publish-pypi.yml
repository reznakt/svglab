name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform.target }} ${{ matrix.python.name }} wheel (${{ matrix.platform.manylinux || matrix.platform.runner }})

    runs-on: ${{ matrix.platform.runner }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
            manylinux: auto
          - runner: ubuntu-latest
            target: aarch64
            manylinux: auto
          - runner: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
          - runner: ubuntu-latest
            target: aarch64
            manylinux: musllinux_1_2
          - runner: macos-latest
            target: x86_64
          - runner: macos-latest
            target: aarch64
          - runner: windows-latest
            target: x64
        python:
          # a single abi3 wheel per platform covers every supported Python
          - name: abi3
          - name: freethreaded
            interpreter: 3.14t

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python.interpreter }}

      - name: Take the version from the release tag
        shell: bash
        run: uv version --frozen "${GITHUB_REF_NAME#v}"

      # the Linux wheels are built in a manylinux container that brings its
      # own interpreters; elsewhere maturin gets the one uv installed
      - name: Locate the interpreter
        if: matrix.python.interpreter && runner.os != 'Linux'
        shell: bash
        run: |
          uv python install "$UV_PYTHON"
          echo "INTERPRETER=$(uv python find "$UV_PYTHON")" >> "$GITHUB_ENV"

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --profile dist --out dist ${{ matrix.python.interpreter && format('--interpreter {0}', env.INTERPRETER || matrix.python.interpreter) || '' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.python.name }}-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ matrix.platform.manylinux || 'native' }}
          path: dist/

  sdist:
    name: Build source distribution

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Take the version from the release tag
        shell: bash
        run: uv version --frozen "${GITHUB_REF_NAME#v}"

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/

  publish:
    name: Publish to PyPI

    needs: [build, sdist]
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/svglab

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
