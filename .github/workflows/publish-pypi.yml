name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform.target }} wheel (${{ matrix.platform.manylinux || matrix.platform.runner }})

    runs-on: ${{ matrix.platform.runner }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
            manylinux: auto
          - runner: ubuntu-latest
            target: aarch64
            manylinux: auto
          - runner: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
          - runner: ubuntu-latest
            target: aarch64
            manylinux: musllinux_1_2
          - runner: macos-latest
            target: x86_64
          - runner: macos-latest
            target: aarch64
          - runner: windows-latest
            target: x64

    steps:
      - uses: actions/checkout@v7

      # a single abi3 wheel per platform covers every supported Python
      - name: Take the version from the release tag
        shell: bash
        run: |
          sed -i.bak "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" pyproject.toml
          rm pyproject.toml.bak

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --profile dist --out dist
          sccache: true

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ matrix.platform.manylinux || 'native' }}
          path: dist/

  build-freethreaded:
    name: Build ${{ matrix.platform.target }} free-threaded wheel (${{ matrix.platform.manylinux || matrix.platform.runner }})

    runs-on: ${{ matrix.platform.runner }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
            manylinux: auto
          - runner: ubuntu-latest
            target: aarch64
            manylinux: auto
          - runner: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
          - runner: ubuntu-latest
            target: aarch64
            manylinux: musllinux_1_2
          - runner: macos-latest
            target: x86_64
          - runner: macos-latest
            target: aarch64
          - runner: windows-latest
            target: x64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        if: runner.os != 'Linux'
        with:
          python-version: 3.14t

      - name: Take the version from the release tag
        shell: bash
        run: |
          sed -i.bak "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" pyproject.toml
          rm pyproject.toml.bak

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --profile dist --out dist --interpreter 3.14t
          sccache: true

      - uses: actions/upload-artifact@v7
        with:
          name: dist-freethreaded-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ matrix.platform.manylinux || 'native' }}
          path: dist/

  sdist:
    name: Build source distribution

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Take the version from the release tag
        shell: bash
        run: |
          sed -i.bak "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" pyproject.toml
          rm pyproject.toml.bak

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/

  publish:
    name: Publish to PyPI

    needs: [build, build-freethreaded, sdist]
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/svglab

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
