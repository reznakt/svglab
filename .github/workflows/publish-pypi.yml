name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform.target }} ${{ matrix.python.name }} wheel (${{ matrix.platform.manylinux || matrix.platform.runner }})

    runs-on: ${{ matrix.platform.runner }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
            manylinux: auto
          - runner: ubuntu-latest
            target: aarch64
            manylinux: auto
          - runner: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
          - runner: ubuntu-latest
            target: aarch64
            manylinux: musllinux_1_2
          - runner: macos-latest
            target: x86_64
          - runner: macos-latest
            target: aarch64
          - runner: windows-latest
            target: x64
        python:
          # a single abi3 wheel per platform covers every supported Python
          - name: abi3
          - name: freethreaded
            interpreter: 3.14t

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        if: matrix.python.interpreter && runner.os != 'Linux'
        with:
          python-version: ${{ matrix.python.interpreter }}

      - uses: astral-sh/setup-uv@v7

      - name: Take the version from the release tag
        shell: bash
        run: uv version --frozen "${GITHUB_REF_NAME#v}"

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --profile dist --out dist ${{ matrix.python.interpreter && format('--interpreter {0}', matrix.python.interpreter) || '' }}
          sccache: true

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.python.name }}-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ matrix.platform.manylinux || 'native' }}
          path: dist/

  sdist:
    name: Build source distribution

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Take the version from the release tag
        shell: bash
        run: uv version --frozen "${GITHUB_REF_NAME#v}"

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/

  publish:
    name: Publish to PyPI

    needs: [build, sdist]
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/svglab

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
