name: check

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.resolution == 'latest' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            resolution: locked
          - python: "3.10"
            resolution: lowest-direct
          - python: "3.11"
            resolution: locked
          - python: "3.12"
            resolution: locked
          - python: "3.13"
            resolution: locked
          - python: "3.14"
            resolution: locked
          - python: "3.14"
            resolution: highest

    defaults:
      run:
        shell: nix develop --command env -u UV_PYTHON -u UV_PYTHON_DOWNLOADS bash -e {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache the Rust build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/svglab-resvg/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src/svglab-resvg/Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install tools
        run: uv sync --all-groups --python ${{ matrix.python }}

      - name: Apply dependency resolution to runtime dependencies
        if: matrix.resolution != 'locked'
        run: uv pip install --python .venv --reinstall --resolution ${{ matrix.resolution }} -e .

      - name: Run tests
        run: just test --cov-branch --cov-report=xml --junitxml=junit.xml

      - name: Upload coverage results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  check:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: nix develop --command bash -e {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache the Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/svglab-resvg/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src/svglab-resvg/Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install tools
        run: uv sync --all-groups

      - name: Run linter
        run: just lint

      - name: Run formatter
        run: just format

      - name: Run type checking
        run: just typecheck

      - name: Run version check
        run: just versioncheck

      - name: Run license check
        run: just licensecheck
