name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.resolution == 'highest' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            resolution: locked
          - python: "3.11"
            resolution: lowest-direct
          - python: "3.12"
            resolution: locked
          - python: "3.13"
            resolution: locked
          - python: "3.14"
            resolution: locked
          - python: "3.14"
            resolution: highest

    defaults:
      run:
        shell: nix develop --command env -u UV_PYTHON -u UV_PYTHON_DOWNLOADS bash -e {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src/svglab-resvg
          cmd-format: nix develop --command {0} # the toolchain lives in the dev shell

      - name: Install tools
        run: uv sync --all-groups --python ${{ matrix.python }}

      - name: Apply dependency resolution to runtime dependencies
        if: matrix.resolution != 'locked'
        run: uv pip install --python .venv --reinstall --resolution ${{ matrix.resolution }} -e .

      - name: Run tests
        run: just test --cov-branch --cov-report=xml --junitxml=junit.xml
        env:
          UV_NO_SYNC: "1" # keep the dependency resolution applied above

      - name: Upload coverage results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: junit.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: nix develop --command bash -e {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan reads the whole history
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src/svglab-resvg
          cmd-format: nix develop --command {0} # the toolchain lives in the dev shell

      - name: Install tools
        run: uv sync --all-groups

      - name: Run linter
        run: just lint

      - name: Run formatter
        run: just format

      - name: Run type checking
        run: just typecheck

      - name: Run version check
        run: just versioncheck

      - name: Run license check
        run: just licensecheck

      - name: Run dependency check
        run: just depcheck

      - name: Run workflow check
        run: just workflowcheck
        env:
          GH_TOKEN: ${{ github.token }} # lets zizmor run its online audits

      - name: Run schema check
        run: just schemacheck

      - name: Run secret scan
        run: just secretcheck
