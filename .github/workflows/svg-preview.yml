name: svg-preview

# the fork's code is never checked out and the job is gated on the author
on: # zizmor: ignore[dangerous-triggers]
  push:
    branches: [main]
    paths:
      - .github/workflows/svg-preview.yml
      - .github/scripts/**
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    types: [opened, edited, reopened]

permissions: {}

concurrency:
  group: svg-preview-${{ github.event.issue.number || github.event.pull_request.number || 'all' }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.event_name == 'push' || contains(
        fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        (github.event.comment || github.event.issue || github.event.pull_request).author_association
      )
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout the script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Preview the SVGs
        run: uv run --script --locked .github/scripts/preview_svgs.py
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
